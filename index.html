<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENEVIEW // AUTONOMOUS CHRONOS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        #header { width: 100%; display: flex; justify-content: space-between; padding: 12px 24px; font-size: 13px; font-weight: bold; color: #FFD700; }
        #clock-bar { font-size: 12px; color: #00FFCC; margin-bottom: 6px; letter-spacing: 1px; }
        #status-card { width: 90%; max-width: 520px; background: rgba(13,27,42,0.9); border: 1px solid #1B4965; border-radius: 12px; padding: 12px 18px; text-align: center; font-size: 14px; min-height: 46px; margin-bottom: 8px; line-height: 1.4; }
        #stage { position: relative; width: 330px; height: 500px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 35px rgba(0,229,255,0.35); background: #000; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #mouth-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #bottom-bar { width: 90%; max-width: 520px; display: flex; background: #11161B; border: 1px solid #263238; border-radius: 30px; padding: 4px 14px; margin-top: 10px; }
        input { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; padding: 10px; outline: none; }
        button { background: transparent; border: none; color: #FFD700; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">
        <div>GENEVIEW // AUTONOMOUS CORE</div>
        <div id="badge" style="color: #00FFCC;">CHRONOS + WEB ONLINE</div>
    </div>
    <div id="clock-bar">BELSŐ ÓRA INDÍTÁSA...</div>

    <div id="status-card">Geneview aktív. Belső órája folyamatosan ketyeg!</div>

    <div id="stage" onclick="initAndAsk()">
        <video id="vid" autoplay loop muted playsinline>
            <source src="/video_feed" type="video/mp4">
        </video>
        <canvas id="mouth-canvas" width="330" height="500"></canvas>
    </div>

    <div id="bottom-bar">
        <input type="text" id="inp" placeholder="Kérdezz bátran (pl.: Milyen nap van ma?)..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">➤</button>
    </div>

    <audio id="player" style="display:none;"></audio>

    <script>
        const vid = document.getElementById('vid');
        const overlay = document.getElementById('mouth-canvas');
        const ctx = overlay.getContext('2d');
        const badge = document.getElementById('badge');
        const statusCard = document.getElementById('status-card');
        const clockBar = document.getElementById('clock-bar');
        const player = document.getElementById('player');

        let isSpeaking = false;
        let visemes = [];
        let startTime = 0;

        setInterval(() => {
            const d = new Date();
            clockBar.innerText = "BELSŐ ÓRA: " + d.getFullYear() + "." + (d.getMonth()+1) + "." + d.getDate() + ". " + d.toLocaleTimeString();
        }, 1000);

        function initAndAsk() {
            if (vid.paused) vid.play();
            startMic();
        }

        setInterval(() => {
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (isSpeaking) {
                let sec = (Date.now() - startTime) / 1000.0;
                let item = visemes.find(v => v.t >= sec);
                let op = item ? item.val : 0;
                if (op > 0.06) {
                    ctx.save();
                    ctx.fillStyle = "rgba(10, 16, 26, 0.85)";
                    ctx.beginPath();
                    ctx.ellipse(165, 195, 14 * op, 9 * op, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }, 30);

        function startMic() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Speech) return;
            const rec = new Speech();
            rec.lang = 'hu-HU';
            rec.onstart = () => {
                badge.innerText = "LISTENING";
                badge.style.color = "#FF1744";
                statusCard.innerText = "Hallgatlak...";
            };
            rec.onresult = (e) => { processQuery(e.results[0][0].transcript); };
            rec.onerror = () => { badge.innerText = "CHRONOS + WEB ONLINE"; badge.style.color = "#00FFCC"; };
            rec.start();
        }

        function sendMsg() {
            let val = document.getElementById('inp').value.trim();
            if (val) {
                processQuery(val);
                document.getElementById('inp').value = "";
            }
        }

        async function processQuery(txt) {
            badge.innerText = "LOGIKAI ELEMZÉS...";
            badge.style.color = "#FFD700";
            statusCard.innerText = "Feldolgozás: " + txt;

            try {
                let res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: txt })
                });
                let d = await res.json();
                statusCard.innerText = d.answer;
                visemes = d.visemes;

                player.src = '/audio?' + Date.now();
                player.play();

                startTime = Date.now();
                isSpeaking = true;
                badge.innerText = "SPEAKING";
                badge.style.color = "#00E5FF";

                player.onended = () => {
                    isSpeaking = false;
                    badge.innerText = "CHRONOS + WEB ONLINE";
                    badge.style.color = "#00FFCC";
                };
            } catch(e) {
                statusCard.innerText = "Hiba történt a kommunikációban.";
                badge.innerText = "ONLINE";
                badge.style.color = "#00FFCC";
            }
        }
    </script>
</body>
</html>
